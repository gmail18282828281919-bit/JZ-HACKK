<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModeraBot — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0e18;--surface:#111522;--surface2:#161a2c;--border:#1c2240;--border-hi:#2a3565;--text:#dde3f5;--muted:#5a6387;--accent:#6ab3e8;--accent2:#3e7fd4;--green:#3ba55d;--red:#ed4245}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.orb{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0;opacity:.5}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(62,127,212,.18) 0%,transparent 70%);top:-150px;left:-100px}
.orb2{width:380px;height:380px;background:radial-gradient(circle,rgba(106,179,232,.12) 0%,transparent 70%);bottom:-80px;right:-80px}

nav{position:sticky;top:0;z-index:100;height:56px;border-bottom:1px solid var(--border);background:rgba(17,21,34,.88);backdrop-filter:blur(16px);display:flex;align-items:center;padding:0 28px}
.nav-left{display:flex;align-items:center;gap:10px}
.nav-left img{width:28px;height:28px;border-radius:8px;object-fit:cover}
.nav-left .name{font-size:15px;font-weight:800;color:#fff}
.nav-left .tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:rgba(106,179,232,.12);padding:2px 9px;border-radius:20px;border:1px solid rgba(106,179,232,.25)}

.page{position:relative;z-index:10;flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:44px 36px;max-width:380px;width:100%;text-align:center;opacity:0;transform:translateY(14px);animation:fadeUp .45s ease forwards}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

.card-logo{width:72px;height:72px;border-radius:18px;object-fit:cover;margin:0 auto 20px;display:block;border:2px solid var(--border-hi)}
.card h1{font-size:20px;font-weight:800;color:#fff;margin-bottom:8px}
.card p{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:28px;line-height:1.5}

.btn-discord{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 20px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-size:14px;font-weight:800;border-radius:12px;text-decoration:none;border:none;cursor:pointer;font-family:'Nunito',sans-serif;transition:transform .18s,box-shadow .18s}
.btn-discord:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(106,179,232,.25)}
.btn-discord svg{flex-shrink:0}

.card-foot{margin-top:22px;font-size:11px;color:var(--muted);line-height:1.5}
.card-foot a{color:var(--accent);text-decoration:none}

footer{position:relative;z-index:10;border-top:1px solid var(--border);padding:13px 28px;display:flex;justify-content:space-between;align-items:center;background:rgba(17,21,34,.8);backdrop-filter:blur(12px);font-size:12px;font-weight:600;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none}
.dot{display:inline-block;width:7px;height:7px;background:#3ba55d;border-radius:50%;margin-right:5px;animation:pulse 2.4s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,165,93,.5)}50%{box-shadow:0 0 0 5px rgba(59,165,93,0)}}

@media(max-width:600px){nav{padding:0 14px}.page{padding:16px}.card{padding:34px 26px}}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<nav>
  <div class="nav-left">
    <img src="logo.png" alt="ModeraBot" onerror="this.style.display='none'">
    <span class="name">ModeraBot</span>
    <span class="tag">Dashboard</span>
  </div>
</nav>

<div class="page">
  <div class="card">
    <img class="card-logo" src="logo.png" alt="ModeraBot" onerror="this.style.display='none'">
    <h1>Bienvenue sur ModeraBot</h1>
    <p>Connecte-toi avec Discord pour gérer tes serveurs et configurer le bot.</p>
    <a class="btn-discord" id="loginBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.197.372.291a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.106c.36.698.772 1.362 1.225 1.994a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.418 0 1.334-.946 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
      Se connecter avec Discord
    </a>
    <div class="card-foot">En te connectant, tu acceptes que ModeraBot accède à la liste de tes serveurs Discord.</div>
  </div>
</div>

<footer>
  <span><span class="dot"></span><span id="botState">Vérification…</span></span>
  <span>ModeraBot © 2026 · <a href="#">Support</a></span>
</footer>

<script>
/* client_id et redirect_uri viennent de l'API du bot (/api/config) :
   plus aucune valeur a modifier a la main dans cette page.

   ATTENTION : on utilise response_type=token (OAuth implicite), comme
   servers.html qui lit le token dans le fragment #access_token=...
   Avec response_type=code, Discord renvoie ?code=... et servers.html
   ne trouvait aucun token -> boucle de connexion. */
const SCOPES   = 'identify guilds';
const FALLBACK = location.origin + '/servers.html';

function setAuth(clientId, redirectUri){
  document.getElementById('loginBtn').href =
    'https://discord.com/oauth2/authorize'
    + '?client_id=' + encodeURIComponent(clientId)
    + '&response_type=token'
    + '&scope=' + encodeURIComponent(SCOPES)
    + '&redirect_uri=' + encodeURIComponent(redirectUri || FALLBACK);
}

/* Etat du bot affiche dans le pied de page (avant : « Bot en ligne » en dur) */
function setFooter(state, text){
  const dot = document.querySelector('footer .dot');
  const lbl = document.getElementById('botState');
  if(lbl) lbl.textContent = text;
  if(!dot) return;
  dot.style.background = state === 'ok' ? '#3ba55d' : state === 'warn' ? '#faa61a' : '#ed4245';
  dot.style.animation  = state === 'ok' ? '' : 'none';
}

async function init(){
  try{
    const r = await fetch('/api/status', { cache: 'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const st = await r.json();
    setFooter(st.bot_ready ? 'ok' : 'warn',
      st.bot_ready
        ? `${st.bot_name ? st.bot_name.split('#')[0] : 'Bot'} en ligne · ${st.guild_count} serveur${st.guild_count > 1 ? 's' : ''}`
        : 'Bot hors ligne — connexion à Discord en cours');
  }catch{
    setFooter('err', "API du bot injoignable");
  }

  try{
    const r = await fetch('/api/config', { cache: 'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const c = await r.json();
    if(c.client_id){ setAuth(c.client_id, c.redirect_uri); return; }
  }catch{}

  // API HS : on desactive proprement le bouton au lieu d'envoyer vers une erreur Discord
  const btn = document.getElementById('loginBtn');
  btn.removeAttribute('href');
  btn.style.opacity = '.55';
  btn.style.cursor = 'not-allowed';
  btn.title = "L'API du bot ne répond pas";
}
init();
</script>
</body>
</html>
