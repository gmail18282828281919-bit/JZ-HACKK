<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModeraBot — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dash.css') }}">
</head>
<body data-guild-id="{{ guild_id }}" data-csrf="{{ csrf }}" data-client-id="{{ client_id }}">
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<nav>
  <a class="nav-left" href="/servers.html">
    <img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="" onerror="this.style.visibility='hidden'">
    <span class="name">ModeraBot</span>
    <span class="tag">Dashboard</span>
  </a>
  <div class="user-pill">
    <img id="uAvatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="">
    <span class="uname" id="uName">…</span>
    <div class="dropdown">
      <a class="dd" href="/servers.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Mes serveurs
      </a>
      <div class="dd danger" onclick="logout()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Déconnexion
      </div>
    </div>
  </div>
</nav>

<div class="shell">
  <aside class="side">
    <a class="back-link" href="/servers.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Changer de serveur
    </a>
    <div class="side-head" id="sideHead">
      <div class="ini">…</div>
      <div class="meta"><div class="gname">Chargement…</div><div class="gsub">—</div></div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
  </aside>

  <main class="main" id="main">
    <div class="loading"><div class="spinner"></div>Chargement du serveur…</div>
  </main>
</div>

<footer>
  <span id="botStatus"><span class="dot"></span>Bot en ligne</span>
  <span>ModeraBot © 2026 · <a href="#">Support</a></span>
</footer>

<div id="toasts"></div>

{# Schéma des modules : même source que le bot (core/defaults.py). #}
<script>window.MODULES = {{ modules|tojson }};</script>
<script src="{{ url_for('static', filename='js/status.js') }}"></script>
<script src="{{ url_for('static', filename='js/dash.js') }}"></script>
</body>
</html>
