<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModeraBot — Choisir un serveur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080b14; --panel:#10141f; --panel2:#161b2a; --line:#1e2437; --line-hi:#2b3350;
  --text:#e2e7f5; --muted:#7b86a8; --dim:#5a6483;
  --accent:#6ab3e8; --accent-deep:#3e7fd4; --signal:#f2a33c; --ok:#3ba55d; --bad:#e05260;
  --display:'Bricolage Grotesque','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*,::before,::after{box-sizing:border-box}
body,h1,h2,p,input,button{margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;
  min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.bar{position:sticky;top:0;z-index:40;height:58px;display:flex;align-items:center;gap:12px;
  padding:0 18px;border-bottom:1px solid var(--line);background:rgba(8,11,20,.86);backdrop-filter:blur(14px)}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:16px}
.logo i{width:28px;height:28px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;color:#06101d;
  background:linear-gradient(140deg,var(--accent-deep),var(--accent))}
.moi{margin-left:auto;display:flex;align-items:center;gap:9px;padding:5px 6px 5px 5px;border-radius:22px;
  border:1px solid var(--line);background:var(--panel);position:relative}
.moi img{width:26px;height:26px;border-radius:50%;background:var(--panel2)}
.moi b{font-size:13px;font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moi button{background:none;border:none;color:var(--muted);padding:4px 8px;border-radius:8px;font-size:12.5px;font-weight:700}
.moi button:hover{color:var(--bad);background:rgba(224,82,96,.1)}

main{flex:1;width:100%;max-width:940px;margin:0 auto;padding:30px 18px 60px}
.titre{font-family:var(--display);font-size:clamp(25px,5vw,34px);font-weight:800;letter-spacing:-.02em}
.sous{color:var(--muted);font-size:14.5px;margin-top:5px}

.chiffres{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}
.chiffre{flex:1;min-width:104px;border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:13px 16px}
.chiffre b{display:block;font-family:var(--display);font-size:21px;font-weight:800;color:var(--accent);
  font-variant-numeric:tabular-nums}
.chiffre span{font-size:12px;font-weight:600;color:var(--dim)}

.filtre{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);padding:0 14px;margin-bottom:24px}
.filtre svg{color:var(--dim);flex-shrink:0}
.filtre input{flex:1;background:none;border:none;color:var(--text);font-family:inherit;font-size:14.5px;
  padding:12px 0;outline:none}
.filtre input::placeholder{color:var(--dim)}

.groupe{margin-bottom:26px}
.groupe h2{font-family:var(--body);font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);display:flex;align-items:center;gap:9px;margin-bottom:11px}
.groupe h2::after{content:"";flex:1;height:1px;background:var(--line)}
.groupe h2 em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}

.liste{display:flex;flex-direction:column;gap:8px}
.srv{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--line);
  border-radius:14px;background:var(--panel);transition:border-color .18s,transform .18s}
.srv:hover{border-color:var(--line-hi)}
.srv.ouvrable{cursor:pointer}
.srv.ouvrable:hover{transform:translateX(3px);border-color:var(--accent)}
.srv .ic{width:42px;height:42px;border-radius:12px;flex-shrink:0;object-fit:cover;background:var(--panel2)}
.srv .init{width:42px;height:42px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:15px;color:#06101d;
  background:linear-gradient(140deg,var(--accent-deep),var(--accent))}
.srv .txt{flex:1;min-width:0}
.srv .txt b{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srv .txt span{font-size:12.5px;color:var(--dim)}
.etat{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;
  border-radius:20px;white-space:nowrap;flex-shrink:0}
.etat.actif{color:var(--accent);background:rgba(106,179,232,.12);border:1px solid rgba(106,179,232,.24)}
.etat.absent{color:var(--muted);background:rgba(123,134,168,.1);border:1px solid rgba(123,134,168,.2)}
.ajout{font-size:12.5px;font-weight:700;color:#06101d;padding:8px 14px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent-deep),var(--accent))}
.ajout:hover{filter:brightness(1.08)}
.fleche{color:var(--dim);flex-shrink:0}

.boite{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:34px 24px;text-align:center}
.boite h3{font-family:var(--display);font-size:18px;font-weight:800;margin-bottom:8px}
.boite p{color:var(--muted);font-size:14px;max-width:52ch;margin:0 auto 6px}
.boite code{font-family:var(--mono);font-size:12.5px;color:var(--text);background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px;overflow-wrap:anywhere}
.boite.rate{border-color:rgba(224,82,96,.35)}
.boite.rate h3{color:var(--bad)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.bouton{padding:10px 18px;border-radius:11px;font-size:14px;font-weight:700;border:1px solid var(--line-hi);
  background:var(--panel2);color:var(--text)}
.bouton:hover{border-color:var(--accent)}
.bouton.plein{background:linear-gradient(135deg,var(--accent-deep),var(--accent));border-color:transparent;color:#06101d}

.tourne{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;
  margin:0 auto 14px;animation:tour .8s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}

.pied{border-top:1px solid var(--line);padding:15px 18px;display:flex;justify-content:space-between;
  gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
.vie{display:inline-flex;align-items:center;gap:7px}
.vie i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.vie.on i{background:var(--ok)}
.vie.off i{background:var(--signal)}
</style>
</head>
<body>

<header class="bar">
  <a class="logo" href="/">
    <i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></i>
    ModeraBot
  </a>
  <div class="moi" id="moi" hidden>
    <img id="moiAvatar" alt="">
    <b id="moiNom">…</b>
    <button type="button" id="deco">Quitter</button>
  </div>
</header>

<main>
  <h1 class="titre">Tes serveurs</h1>
  <p class="sous">Choisis celui que tu veux configurer.</p>

  <div class="chiffres" id="chiffres" hidden>
    <div class="chiffre"><b id="nTotal">—</b><span>Serveurs</span></div>
    <div class="chiffre"><b id="nBot">—</b><span>Avec le bot</span></div>
    <div class="chiffre"><b id="nAdmin">—</b><span>Gérables</span></div>
  </div>

  <label class="filtre" id="filtre" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.7" y2="16.7"/></svg>
    <input type="search" id="recherche" placeholder="Filtrer par nom…" autocomplete="off">
  </label>

  <div id="zone">
    <div class="boite"><div class="tourne"></div><p>Chargement…</p></div>
  </div>
</main>

<footer class="pied">
  <span class="vie" id="vie"><i></i><span id="vieTxt">Vérification du bot…</span></span>
  <span>ModeraBot · Dashboard</span>
</footer>

<script>
"use strict";
/* ---------------------------------------------------------------------------
   Choix du serveur.

   Le navigateur parle directement a Discord (OAuth implicite) : l'API du bot
   n'est sollicitee que pour deux choses, sa configuration OAuth et la liste
   des serveurs ou il est present. Une requete par etape, jamais de rafale :
   chaque appel a l'API declenche une verification de jeton cote bot, et les
   multiplier fait tomber le serveur en timeout.
--------------------------------------------------------------------------- */

const API = (window.MB_API_BASE || "").replace(/\/+$/, "");
const CLE_JETON = "mb_discord_token";       // partage avec dash.html
const PAGE_DASH = "/dash.html";
const PAGE_ACCUEIL = "/index.html";
const DELAI = 9000;                          // au-dela, on affiche une erreur

const el = (id) => document.getElementById(id);
const proteger = (t) => String(t ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let clientId = "";
let redirection = location.origin + "/servers.html";
let serveurs = [];
let idsAvecBot = null;      // null = presence inconnue

/* ------------------------------------------------------------------ reseau */

async function demander(url, options = {}) {
  const arret = new AbortController();
  const minuteur = setTimeout(() => arret.abort(), options.delai || DELAI);
  try {
    return await fetch(url, { ...options, signal: arret.signal, cache: "no-store" });
  } finally {
    clearTimeout(minuteur);
  }
}

async function json(url, options) {
  const reponse = await demander(url, options);
  if (!reponse.ok) {
    const erreur = new Error("HTTP " + reponse.status);
    erreur.statut = reponse.status;
    throw erreur;
  }
  return reponse.json();
}

const entetes = () => {
  const jeton = lireJeton();
  return jeton ? { Authorization: "Bearer " + jeton } : {};
};

async function discord(chemin, jeton) {
  for (let essai = 0; essai < 3; essai++) {
    const reponse = await demander("https://discord.com/api/v10" + chemin, {
      headers: { Authorization: "Bearer " + jeton },
    });
    if (reponse.status === 429) {
      let attente = 1200;
      try {
        const corps = await reponse.json();
        if (corps.retry_after) attente = Math.ceil(corps.retry_after * 1000) + 200;
      } catch (_) { /* corps illisible : on garde l'attente par defaut */ }
      await new Promise((r) => setTimeout(r, Math.min(attente, 5000)));
      continue;
    }
    if (reponse.status === 401) {
      const erreur = new Error("jeton expire");
      erreur.statut = 401;
      throw erreur;
    }
    if (!reponse.ok) throw new Error("Discord a repondu " + reponse.status);
    return reponse.json();
  }
  throw new Error("Discord limite les requetes, reessaie dans un instant");
}

/* ------------------------------------------------------------------- jeton */

function poserJeton(valeur, duree) {
  try {
    sessionStorage.setItem(CLE_JETON, JSON.stringify({
      t: valeur,
      exp: Date.now() + (Number(duree || 604800) * 1000) - 60000,
    }));
  } catch (_) { /* navigation privee : on continue sans memoriser */ }
}

function lireJeton() {
  try {
    const brut = JSON.parse(sessionStorage.getItem(CLE_JETON) || "null");
    if (!brut || !brut.t || Date.now() > brut.exp) {
      sessionStorage.removeItem(CLE_JETON);
      return null;
    }
    return brut.t;
  } catch (_) {
    return null;
  }
}

const oublierJeton = () => { try { sessionStorage.removeItem(CLE_JETON); } catch (_) {} };

const lienAutorisation = (invite) =>
  "https://discord.com/oauth2/authorize?client_id=" + encodeURIComponent(clientId) +
  "&response_type=token&scope=" + encodeURIComponent("identify guilds") +
  "&redirect_uri=" + encodeURIComponent(redirection) +
  (invite ? "&prompt=" + invite : "");

const lienInvitation = (guildId) =>
  "https://discord.com/oauth2/authorize?client_id=" + encodeURIComponent(clientId) +
  "&permissions=8&scope=bot+applications.commands" +
  (guildId ? "&guild_id=" + encodeURIComponent(guildId) : "");

/* ---------------------------------------------------------------- affichage */

function message(titre, texte, indice, rate) {
  el("zone").innerHTML =
    '<div class="boite' + (rate ? " rate" : "") + '">' +
      "<h3>" + proteger(titre) + "</h3>" +
      "<p>" + proteger(texte) + "</p>" +
      (indice ? "<p>" + indice + "</p>" : "") +
      '<div class="actions">' +
        '<a class="bouton plein" href="' + lienAutorisation("consent") + '">Se connecter à Discord</a>' +
        '<button class="bouton" type="button" onclick="location.reload()">Réessayer</button>' +
        '<a class="bouton" href="' + PAGE_ACCUEIL + '">Accueil</a>' +
      "</div></div>";
}

function patienter(texte) {
  el("zone").innerHTML = '<div class="boite"><div class="tourne"></div><p>' + proteger(texte) + "</p></div>";
}

function initiales(nom) {
  const mots = String(nom || "?").trim().split(/\s+/).filter(Boolean);
  return mots.length ? mots.map((m) => m[0]).join("").slice(0, 2).toUpperCase() : "?";
}

function avatar(utilisateur) {
  if (utilisateur && utilisateur.avatar) {
    const format = String(utilisateur.avatar).startsWith("a_") ? "gif" : "png";
    return "https://cdn.discordapp.com/avatars/" + utilisateur.id + "/" + utilisateur.avatar + "." + format + "?size=64";
  }
  let index = 0;
  try {
    index = utilisateur.discriminator && utilisateur.discriminator !== "0"
      ? Number(utilisateur.discriminator) % 5
      : Number((BigInt(utilisateur.id) >> BigInt(22)) % BigInt(6));
  } catch (_) { index = 0; }
  return "https://cdn.discordapp.com/embed/avatars/" + index + ".png";
}

function peutGerer(serveur) {
  if (serveur.owner === true) return true;
  try {
    const droits = BigInt(serveur.permissions_new ?? serveur.permissions ?? "0");
    return (droits & BigInt(0x8)) !== BigInt(0) || (droits & BigInt(0x20)) !== BigInt(0);
  } catch (_) {
    return false;
  }
}

const aLeBot = (serveur) => (idsAvecBot === null ? null : idsAvecBot.has(String(serveur.id)));

function ligne(serveur) {
  const gerable = peutGerer(serveur);
  const present = aLeBot(serveur);
  const ouvrable = gerable && present !== false;

  const noeud = document.createElement(ouvrable ? "a" : "div");
  noeud.className = "srv" + (ouvrable ? " ouvrable" : "");
  noeud.dataset.nom = String(serveur.name || "").toLowerCase();
  if (ouvrable) noeud.href = PAGE_DASH + "?guild=" + encodeURIComponent(serveur.id);

  const icone = serveur.icon
    ? '<img class="ic" loading="lazy" referrerpolicy="no-referrer" alt="" src="https://cdn.discordapp.com/icons/' +
      serveur.id + "/" + serveur.icon + "." + (String(serveur.icon).startsWith("a_") ? "gif" : "png") + '?size=96">'
    : '<div class="init">' + proteger(initiales(serveur.name)) + "</div>";

  let role = "Membre";
  if (serveur.owner === true) role = "Propriétaire";
  else if (gerable) role = "Administrateur";

  let droite;
  if (gerable && present === false) {
    droite = '<a class="ajout" href="' + lienInvitation(serveur.id) + '" target="_blank" rel="noopener">Ajouter le bot</a>';
  } else if (ouvrable) {
    droite = '<span class="etat actif">' + (present === null ? "Gérable" : "Actif") + "</span>" +
      '<svg class="fleche" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>';
  } else {
    droite = '<span class="etat absent">' + (present ? "Bot actif" : "Non gérable") + "</span>";
  }

  noeud.innerHTML = icone +
    '<div class="txt"><b>' + proteger(serveur.name) + "</b><span>" + role + "</span></div>" + droite;
  return noeud;
}

function afficher() {
  const zone = el("zone");
  zone.innerHTML = "";

  if (!serveurs.length) {
    message("Aucun serveur", "Ton compte Discord n'est membre d'aucun serveur.", "");
    return;
  }

  const gerables = serveurs.filter(peutGerer);
  const autres = serveurs.filter((s) => !peutGerer(s));
  const avecBot = gerables.filter((s) => aLeBot(s) !== false);
  const sansBot = gerables.filter((s) => aLeBot(s) === false);

  const bloc = (titre, liste, note) => {
    if (!liste.length) return;
    const section = document.createElement("section");
    section.className = "groupe";
    section.innerHTML = "<h2>" + proteger(titre) + (note ? " <em>" + proteger(note) + "</em>" : "") + "</h2>";
    const conteneur = document.createElement("div");
    conteneur.className = "liste";
    liste.forEach((s) => conteneur.appendChild(ligne(s)));
    section.appendChild(conteneur);
    zone.appendChild(section);
  };

  bloc(idsAvecBot === null ? "Serveurs que tu administres" : "Prêts à configurer", avecBot);
  bloc("Le bot n'y est pas encore", sansBot);
  bloc("Autres serveurs", autres, autres.length + " sans droits");

  el("nTotal").textContent = serveurs.length;
  el("nBot").textContent = idsAvecBot === null ? "—" : avecBot.length;
  el("nAdmin").textContent = gerables.length;
  el("chiffres").hidden = false;
  el("filtre").hidden = false;
}

/* ------------------------------------------------------------ pied de page */

async function etatDuBot() {
  const vie = el("vie");
  try {
    const etat = await json(API + "/api/status");
    vie.className = "vie " + (etat.bot_ready ? "on" : "off");
    el("vieTxt").textContent = etat.bot_ready
      ? "Bot en ligne · " + (etat.guild_count || 0) + " serveur" + ((etat.guild_count || 0) > 1 ? "s" : "")
      : "Bot en cours de démarrage";
  } catch (_) {
    vie.className = "vie off";
    el("vieTxt").textContent = "API du bot injoignable";
  }
}

/* ------------------------------------------------------------------ demarrage */

async function presenceDuBot() {
  /* Une seule requete : app.py renvoie les serveurs communs au bot et a moi. */
  try {
    const corps = await json(API + "/api/bot-guilds", { headers: entetes() });
    const ids = corps.bot_guild_ids || corps.botGuildIds || corps.bot_guilds;
    if (Array.isArray(ids)) return new Set(ids.map(String));
  } catch (_) { /* route absente ou API muette : presence inconnue */ }
  return null;
}

async function demarrer() {
  etatDuBot();

  try {
    const config = await json(API + "/api/config");
    if (config.client_id) clientId = config.client_id;
    if (config.redirect_uri) redirection = config.redirect_uri;
  } catch (_) { /* on tente quand meme : le jeton est peut-etre deja la */ }

  if (!clientId) {
    message("L'API du bot ne répond pas",
      "Impossible de récupérer la configuration Discord du bot.",
      "Vérifie que le bot tourne et que <code>/api/config</code> répond.", true);
    return;
  }

  const parametres = new URLSearchParams(location.search);
  const fragment = new URLSearchParams(location.hash.replace(/^#/, ""));

  const refus = fragment.get("error") || parametres.get("error");
  if (refus) {
    history.replaceState({}, "", "/servers.html");
    const detail = fragment.get("error_description") || parametres.get("error_description") || refus;
    message("Connexion Discord refusée",
      decodeURIComponent(String(detail).replace(/\+/g, " ")),
      "Dans le portail Discord → OAuth2 → Redirects, ajoute exactement : <code>" + proteger(redirection) + "</code>",
      true);
    return;
  }

  let jeton = fragment.get("access_token");
  if (jeton) {
    poserJeton(jeton, fragment.get("expires_in"));
    history.replaceState({}, "", "/servers.html");
  } else {
    jeton = lireJeton();
  }

  if (!jeton) {
    patienter("Connexion à Discord…");
    location.href = lienAutorisation("none");
    return;
  }

  patienter("Chargement de tes serveurs…");

  let utilisateur;
  try {
    utilisateur = await discord("/users/@me", jeton);
    serveurs = await discord("/users/@me/guilds", jeton);
  } catch (erreur) {
    if (erreur.statut === 401) {
      oublierJeton();
      location.href = lienAutorisation("consent");
      return;
    }
    message("Impossible de charger tes serveurs", erreur.message || String(erreur),
      "Déconnecte-toi puis reconnecte-toi si le problème persiste.", true);
    return;
  }

  el("moiNom").textContent = utilisateur.global_name || utilisateur.username || "Utilisateur";
  el("moiAvatar").src = avatar(utilisateur);
  el("moi").hidden = false;

  if (!Array.isArray(serveurs)) {
    message("Réponse inattendue", "Discord n'a pas renvoyé une liste de serveurs.", "", true);
    return;
  }

  serveurs.sort((a, b) => String(a.name).localeCompare(String(b.name)));
  idsAvecBot = await presenceDuBot();
  afficher();
}

/* --------------------------------------------------------------- evenements */

el("deco").addEventListener("click", async () => {
  oublierJeton();
  try {
    await demander(API + "/api/logout", { method: "POST", headers: entetes(), delai: 4000 });
  } catch (_) { /* deconnexion locale suffisante */ }
  location.href = PAGE_ACCUEIL;
});

el("recherche").addEventListener("input", (evenement) => {
  const cherche = evenement.target.value.trim().toLowerCase();
  document.querySelectorAll(".srv").forEach((noeud) => {
    noeud.style.display = !cherche || noeud.dataset.nom.includes(cherche) ? "" : "none";
  });
  document.querySelectorAll(".groupe").forEach((section) => {
    const visible = [...section.querySelectorAll(".srv")].some((n) => n.style.display !== "none");
    section.style.display = visible ? "" : "none";
  });
});

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", demarrer);
else demarrer();
</script>
</body>
</html>
