<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ModeraBot — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d12; --card:#141824; --card2:#1b2030; --line:#252b3d;
  --txt:#eef1f8; --dim:#8f98b2; --acc:#5865F2; --acc2:#7c86ff; --ok:#57F287; --err:#ED4245;
}
body{background:var(--bg);color:var(--txt);font-family:Outfit,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  background-image:radial-gradient(900px 500px at 50% -10%,rgba(88,101,242,.28),transparent 70%)}
.wrap{width:100%;max-width:520px;text-align:center}
.logo{width:78px;height:78px;border-radius:22px;background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:34px;
  box-shadow:0 18px 50px rgba(88,101,242,.35)}
h1{font-size:34px;font-weight:800;letter-spacing:-.5px;margin-bottom:10px}
p.sub{color:var(--dim);font-size:15px;line-height:1.6;margin-bottom:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--line);
  background:var(--card2);color:var(--txt);padding:13px 22px;border-radius:12px;font:inherit;font-weight:600;
  font-size:15px;cursor:pointer;text-decoration:none;transition:.16s}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;
  box-shadow:0 10px 30px rgba(88,101,242,.32)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.status{margin-top:30px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  display:flex;align-items:center;gap:12px;justify-content:center;font-size:14px;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.off{background:var(--err);box-shadow:0 0 10px var(--err)}
.foot{margin-top:26px;color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🛡️</div>
  <h1>Tableau de bord</h1>
  <p class="sub">Connecte-toi avec Discord pour configurer ton bot :<br>tickets, anti-raid, logs, bienvenue, niveaux, giveaways…</p>
  <div class="row">
    <a class="btn p" id="btnLogin" href="#">Se connecter avec Discord</a>
    <a class="btn" id="btnInvite" href="#" target="_blank" rel="noopener">Inviter le bot</a>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Vérification de l'API du bot…</span></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const SCOPES='identify guilds';

async function init(){
  let cfg=null;
  try{
    const r=await fetch('/api/config',{cache:'no-store'});
    if(r.ok) cfg=await r.json();
  }catch(e){}

  if(!cfg){
    $('dot').className='dot off';
    $('statusTxt').textContent="L'API du bot ne répond pas — vérifie qu'il tourne.";
    return;
  }

  $('dot').className='dot '+(cfg.bot_ready?'on':'off');
  $('statusTxt').textContent = cfg.bot_ready
    ? `${cfg.bot_name||'Bot'} en ligne · ${cfg.guild_count} serveur${cfg.guild_count>1?'s':''}`
    : "Le bot démarre… (connexion à Discord en cours)";

  if(cfg.invite_url) $('btnInvite').href=cfg.invite_url; else $('btnInvite').style.display='none';

  if(cfg.client_id){
    $('btnLogin').href='https://discord.com/oauth2/authorize'
      +'?client_id='+encodeURIComponent(cfg.client_id)
      +'&response_type=token'
      +'&scope='+encodeURIComponent(SCOPES)
      +'&redirect_uri='+encodeURIComponent(cfg.redirect_uri);
    $('foot').textContent='Redirect URI attendue : '+cfg.redirect_uri;
  }else{
    $('btnLogin').removeAttribute('href');
    $('foot').textContent="client_id manquant côté bot — renseigne-le dans config.json.";
  }
}
init();
</script>
</body>
</html>
