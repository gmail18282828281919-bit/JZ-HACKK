<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes serveurs — ModeraBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d12; --card:#141824; --card2:#1b2030; --line:#252b3d;
  --txt:#eef1f8; --dim:#8f98b2; --acc:#5865F2; --acc2:#7c86ff; --ok:#57F287; --err:#ED4245;
}
body{background:var(--bg);color:var(--txt);font-family:Outfit,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;
  background-image:radial-gradient(900px 460px at 50% -10%,rgba(88,101,242,.22),transparent 70%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;
  border-bottom:1px solid var(--line);background:rgba(11,13,18,.7);backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px;color:var(--txt);text-decoration:none}
.brand .ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;font-size:17px}
.me{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:5px 6px 5px 12px;font-size:14px;font-weight:600}
.me img{width:28px;height:28px;border-radius:50%}
.lo{border:0;background:transparent;color:var(--dim);cursor:pointer;font:inherit;font-size:13px;padding:0 8px}
.lo:hover{color:var(--err)}
main{max-width:1000px;margin:0 auto;padding:34px 22px 60px}
h1{font-size:29px;font-weight:800;letter-spacing:-.4px;margin-bottom:7px}
.sub{color:var(--dim);font-size:14.5px;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;
  align-items:center;gap:13px;transition:.16s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.gi{width:50px;height:50px;border-radius:15px;flex:none;object-fit:cover;background:var(--card2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--dim)}
.gt{flex:1;min-width:0}
.gt b{display:block;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt span{display:block;color:var(--dim);font-size:12.5px;margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card2);
  color:var(--txt);padding:9px 15px;border-radius:10px;font:inherit;font-weight:600;font-size:13.5px;
  cursor:pointer;text-decoration:none;white-space:nowrap;transition:.16s}
.btn:hover{border-color:var(--acc)}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
.sec{margin:34px 0 14px;font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--dim)}
.state{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 22px;text-align:center}
.state h3{font-size:18px;margin-bottom:8px}
.state p{color:var(--dim);font-size:14px;line-height:1.6;margin-bottom:18px}
.sp{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;
  margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="/"><span class="ic">🛡️</span>ModeraBot</a>
  <div class="me" id="me" style="display:none">
    <img id="meAvatar" alt=""><span id="meName">…</span>
    <button class="lo" id="btnLogout" title="Se déconnecter">Déconnexion</button>
  </div>
</div>
<main>
  <h1>Mes serveurs</h1>
  <div class="sub">Choisis le serveur à configurer. Seuls les serveurs où tu as <b>Administrateur</b> ou <b>Gérer le serveur</b> sont affichés.</div>
  <div id="out"><div class="state"><div class="sp"></div><p>Chargement de tes serveurs…</p></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOKEN_KEY='mb_discord_token', SCOPES='identify guilds';
let CFG=null;

/* ---- token : stocke au meme format que dashboard.html ---- */
function saveToken(t,expiresIn){
  try{ sessionStorage.setItem(TOKEN_KEY,JSON.stringify({t,exp:Date.now()+(Number(expiresIn)||3600)*1000-60000})); }catch{}
}
function loadToken(){
  try{
    const o=JSON.parse(sessionStorage.getItem(TOKEN_KEY)||'null');
    if(!o||!o.t||Date.now()>o.exp){ sessionStorage.removeItem(TOKEN_KEY); return null; }
    return o.t;
  }catch{ return null; }
}
/* recupere le token renvoye par Discord dans le fragment #access_token=... */
function grabFragment(){
  const h=location.hash||'';
  if(!h.includes('access_token')) return null;
  const p=new URLSearchParams(h.slice(1));
  const t=p.get('access_token');
  if(t) saveToken(t,p.get('expires_in'));
  history.replaceState({},'',location.pathname);   // nettoie l'URL
  return t;
}
const authorizeURL=()=>'https://discord.com/oauth2/authorize'
  +'?client_id='+encodeURIComponent(CFG.client_id)
  +'&response_type=token&scope='+encodeURIComponent(SCOPES)
  +'&redirect_uri='+encodeURIComponent(CFG.redirect_uri);

function avatarURL(u){
  if(u&&u.avatar) return `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${String(u.avatar).startsWith('a_')?'gif':'png'}?size=64`;
  let i=0; try{ i=(u.discriminator&&u.discriminator!=='0')?Number(u.discriminator)%5:Number((BigInt(u.id)>>BigInt(22))%BigInt(6)); }catch{}
  return `https://cdn.discordapp.com/embed/avatars/${i}.png`;
}
const initials=n=>{const p=String(n||'?').trim().split(/\s+/).filter(Boolean);
  return p.length?p.map(w=>w[0]).join('').slice(0,2).toUpperCase():'?';};

function state(title,text,actions){
  $('out').innerHTML=`<div class="state"><h3>${esc(title)}</h3><p>${esc(text)}</p>${actions||''}</div>`;
}

function cardHTML(g){
  const ic=g.icon?`<img class="gi" src="https://cdn.discordapp.com/icons/${g.id}/${g.icon}.${String(g.icon).startsWith('a_')?'gif':'png'}?size=128" alt="" referrerpolicy="no-referrer">`
                 :`<div class="gi">${esc(initials(g.name))}</div>`;
  const meta=g.owner?'Propriétaire':'Administrateur';
  const action=g.bot_present
    ? `<a class="btn p" href="/dashboard.html?guild=${encodeURIComponent(g.id)}">Configurer</a>`
    : `<a class="btn" href="${esc(CFG.invite_url)}&guild_id=${encodeURIComponent(g.id)}" target="_blank" rel="noopener">Ajouter</a>`;
  return `<div class="card">${ic}<div class="gt"><b>${esc(g.name)}</b><span>${esc(meta)}</span></div>${action}</div>`;
}

function renderGuilds(data){
  const withBot=data.guilds.filter(g=>g.bot_present);
  const without=data.guilds.filter(g=>!g.bot_present);

  if(!data.guilds.length){
    state('Aucun serveur éligible',
      "Tu n'as la permission Administrateur ou Gérer le serveur sur aucun serveur.",
      `<a class="btn" href="/">Retour</a>`);
    return;
  }
  let html='';
  if(withBot.length) html+=`<div class="sec">Bot installé — ${withBot.length}</div><div class="grid">${withBot.map(cardHTML).join('')}</div>`;
  if(without.length) html+=`<div class="sec">Bot non installé — ${without.length}</div><div class="grid">${without.map(cardHTML).join('')}</div>`;
  $('out').innerHTML=html;
}

async function boot(){
  try{
    const r=await fetch('/api/config',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    CFG=await r.json();
  }catch(e){
    state("L'API du bot ne répond pas",
      "Le bot est-il démarré ? Vérifie aussi que le port du dashboard est bien ouvert.",
      `<button class="btn p" onclick="location.reload()">Réessayer</button>`);
    return;
  }
  if(!CFG.client_id){
    state('Configuration incomplète',"client_id manquant côté bot — renseigne-le dans config.json.",'');
    return;
  }

  grabFragment();
  const token=loadToken();
  if(!token){ location.href=authorizeURL(); return; }

  let data;
  try{
    const r=await fetch('/api/me',{cache:'no-store',headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
    if(r.status===401){ try{sessionStorage.removeItem(TOKEN_KEY);}catch{} location.href=authorizeURL(); return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    data=await r.json();
  }catch(e){
    state('Chargement impossible',String(e.message||e),
      `<button class="btn p" onclick="location.reload()">Réessayer</button>`);
    return;
  }

  $('meName').textContent=data.user.global_name||data.user.username||'Utilisateur';
  $('meAvatar').src=avatarURL(data.user);
  $('me').style.display='flex';
  renderGuilds(data);
}

$('btnLogout').addEventListener('click',()=>{
  try{ sessionStorage.removeItem(TOKEN_KEY); }catch{}
  fetch('/api/logout',{method:'POST'}).catch(()=>{}).finally(()=>location.href='/');
});
boot();
</script>
</body>
</html>
