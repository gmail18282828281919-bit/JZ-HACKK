<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0e27"/>

  <!-- Outer circle glow -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.3"/>

  <!-- Main circle -->
  <circle cx="256" cy="256" r="200" fill="#1a2049" stroke="#00d4ff" stroke-width="3"/>

  <!-- Lightning bolt (top) -->
  <path d="M 256 120 L 280 200 L 240 200 L 280 320 L 220 280 L 260 280 Z" fill="#00d4ff" stroke="#00d4ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Inner circle accent -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>

  <!-- Text arc path for "NEXUS" -->
  <defs>
    <path id="circlePath" d=" M 256, 100 A 156, 156 0 0,1 256, 412 A 156, 156 0 0,1 256, 100" fill="none"/>
  </defs>

  <!-- NEXUS text -->
  <text font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00d4ff" text-anchor="middle" letter-spacing="2">
    <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
      NEXUS
    </textPath>
  </text>
</svg>
