<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>ModeraBot</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#080b16}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e6ecf9;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:40px;text-align:center;
  background:
    radial-gradient(600px 500px at 10% 0%,rgba(59,130,246,.22),transparent 60%),
    radial-gradient(500px 460px at 105% 20%,rgba(37,99,235,.16),transparent 62%),#080b16}
.logo{width:132px;height:132px;border-radius:38px;background:linear-gradient(135deg,#2563eb,#3b82f6);
  display:flex;align-items:center;justify-content:center;font-size:66px;font-weight:800;color:#fff;
  box-shadow:0 0 70px rgba(59,130,246,.55);animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
h1{font-size:56px;font-weight:800;line-height:1.08;letter-spacing:-.03em;animation:up .6s .1s backwards}
h1 em{font-style:normal;background:linear-gradient(100deg,#3b82f6,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.url{font-size:27px;font-weight:800;color:#3b82f6;animation:up .6s .25s backwards}
.f{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:600px;animation:up .6s .4s backwards}
.f span{font-size:17px;font-weight:600;color:#8794b3;background:#111828;border:2px solid #1e2942;padding:10px 18px;border-radius:22px}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
</style></head><body>
<div class="logo">M</div>
<h1>ModeraBot<br><em>le dashboard qui fait tout</em></h1>
<div class="url">dashboard.moderabot.xyz</div>
<div class="f"><span>Tickets</span><span>AutoMod</span><span>Anti-raid</span><span>Vérification</span>
<span>Logs</span><span>Bienvenue</span><span>Niveaux</span><span>Giveaways</span></div>
</body></html>
