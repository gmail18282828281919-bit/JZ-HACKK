# ─────────────────────────────────────────────────────────────────────────
#  nginx expose UNIQUEMENT le dashboard (Flask sur 127.0.0.1:5000).
#  Le bot Discord n'ecoute sur AUCUN port : il sort en WebSocket vers Discord.
#  Ne jamais mettre le bot derriere un proxy / port ouvert.
#
#  /etc/nginx/sites-available/moderabot  ->  ln -s ... /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────────────────

# Limite de debit sur l'API (les actions sont aussi limitees cote Flask).
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.moderabot.xyz;

    # ACME (certbot) puis redirection HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.moderabot.xyz;

    ssl_certificate     /etc/letsencrypt/live/dashboard.moderabot.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.moderabot.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' https://cdn.discordapp.com data:; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src https://fonts.gstatic.com; script-src 'self'; \
         connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    client_max_body_size 512k;

    # Fichiers statiques servis directement par nginx (Flask ne les voit pas).
    location /static/ {
        alias /opt/moderabot/web/static/;
        expires 7d;
        access_log off;
    }

    location /login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }
}

# /etc/nginx/proxy_params doit contenir :
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_read_timeout 30s;
