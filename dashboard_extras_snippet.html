const xesc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const xclone=o=>JSON.parse(JSON.stringify(o));

function xinject(){
  const app=document.getElementById('app'); if(!app) return;
  const bar=document.getElementById('savebar');
  for(const [key,html] of Object.entries(PAGES_HTML)){
    if(document.getElementById('pg-'+key)) continue;
    const d=document.createElement('div');
    d.className='page'; d.id='pg-'+key; d.innerHTML=html;
    if(bar) app.insertBefore(d,bar); else app.appendChild(d);
  }
}

function xextend(){
  try{
    if(!NAV.some(g=>g[0]===XNAV[0])) NAV.push(XNAV);
    XNAV[1].forEach(([k,t,s])=>{PAGES[k]=[t,s];});
    DEFAULTS.extras=xclone(XDEF);
    if(!cfg.extras) cfg.extras=xclone(XDEF);
    if(!saved.extras) saved.extras=xclone(XDEF);
    const add=[
      ['xeconomy','Économie',c=>!!(c.extras&&c.extras.economy.enabled)],
      ['xautomod','AutoMod',c=>!!(c.extras&&c.extras.automod.enabled)],
      ['xsuggestions','Suggestions',c=>!!(c.extras&&c.extras.suggestions.enabled)],
      ['xpolls','Sondages',c=>!!(c.extras&&c.extras.polls.enabled)],
      ['xguard','Protection',c=>!!(c.extras&&(c.extras.guard.raidmode||c.extras.guard.agegate))],
      ['xapply','Candidatures',c=>!!(c.extras&&c.extras.apply.enabled)],
    ];
    add.forEach(m=>{ if(!MODULES.some(x=>x[0]===m[0])) MODULES.push(m); });
    if(typeof buildNav==='function') buildNav();
  }catch(e){}
}

function xBuildShop(){
  const box=document.getElementById('xShop'); if(!box) return;
  const list=(cfg.extras&&cfg.extras.economy.shop)||[];
  box.innerHTML=list.length?list.map((it,i)=>`
    <div class="tk">
      <div class="tk-h">
        <b>${xesc(it.nom||'Sans nom')}</b>
        <span class="pill-i">Article ${i+1}</span>
        <button class="btn sm dg" data-xshoprm="${i}">Supprimer</button>
      </div>
      <div class="tk-grid">
        <div><label>Nom de l'article</label><input type="text" maxlength="40" data-k="extras.economy.shop.${i}.nom"></div>
        <div><label>Prix</label><input type="number" min="0" data-k="extras.economy.shop.${i}.prix"></div>
        <div class="full"><label>Description</label><input type="text" maxlength="100" data-k="extras.economy.shop.${i}.description"></div>
        <div><label>Rôle donné à l'achat</label><span data-select="role" data-sk="extras.economy.shop.${i}.role"></span></div>
        <div><label>Stock</label><input type="number" min="-1" data-k="extras.economy.shop.${i}.stock">
          <div class="mini">-1 = illimité</div></div>
      </div>
    </div>`).join('')
    :`<div class="empty">Aucun article. La commande <code>+shop</code> répondra que la boutique est vide.</div>`;
}

function xBuildPostes(){
  const box=document.getElementById('xPostes'); if(!box) return;
  const list=(cfg.extras&&cfg.extras.apply.postes)||[];
  box.innerHTML=list.length?list.map((p,i)=>`
    <div class="tk">
      <div class="tk-h">
        <span class="em">${xesc(p.emoji||'')}</span>
        <b>${xesc(p.nom||'Sans nom')}</b>
        <span class="pill-i">${(p.questions||[]).length} question(s)</span>
        <button class="btn sm dg" data-xposterm="${i}">Supprimer</button>
      </div>
      <div class="tk-grid">
        <div><label>Nom du poste</label><input type="text" maxlength="40" data-k="extras.apply.postes.${i}.nom"></div>
        <div><label>Emoji affiché dans le menu</label><input type="text" maxlength="8" data-k="extras.apply.postes.${i}.emoji"></div>
        <div class="full"><label>Description courte</label><input type="text" maxlength="90" data-k="extras.apply.postes.${i}.description">
          <div class="mini">Affichée sous le nom dans le menu déroulant.</div></div>
        <div class="full"><label>Questions du formulaire</label>
          <textarea data-xq="${i}" placeholder="Ton âge ?"></textarea>
          <div class="mini">Une question par ligne, 5 maximum, 45 caractères chacune.</div></div>
      </div>
    </div>`).join('')
    :`<div class="empty">Aucun poste. Le bouton de candidature répondra qu'aucun poste n'est ouvert.</div>`;
  box.querySelectorAll('[data-xq]').forEach(ta=>{
    const i=Number(ta.dataset.xq);
    ta.value=((cfg.extras.apply.postes[i]||{}).questions||[]).join('\n');
  });
}

function xBuildBadwords(){
  const box=document.getElementById('xBwChips'); if(!box) return;
  const l=(cfg.extras&&cfg.extras.automod.badwords)||[];
  box.innerHTML=l.map((v,i)=>`<span class="chip"><b>${xesc(v)}</b><button type="button" data-xbwrm="${i}">×</button></span>`).join('')
    ||'<span class="mini">Aucun mot filtré.</span>';
}

function xBuildAmChannels(){
  const box=document.getElementById('xAmChans'); if(!box) return;
  const cur=((cfg.extras&&cfg.extras.automod.ignored_channels)||[]).map(String);
  const name=id=>{const c=(META.channels||[]).find(c=>String(c.id)===String(id));return c?'#'+c.name:'ID '+id;};
  const chips=cur.map((id,i)=>`<span class="chip"><b>${xesc(name(id))}</b><button type="button" data-xchrm="${i}">×</button></span>`).join('');
  const adder=(META.channels||[]).length
    ? `<select id="xChAdd"><option value="">+ Ignorer un salon…</option>${(META.channels||[])
        .filter(c=>!cur.includes(String(c.id)))
        .map(c=>`<option value="${xesc(c.id)}">#${xesc(c.name)}</option>`).join('')}</select>`
    : `<div class="add"><input type="text" inputmode="numeric" id="xChIn" placeholder="ID du salon"><button class="btn" id="xChBtn">Ajouter</button></div>`;
  box.innerHTML=`<div class="chips" style="margin:0 0 10px">${chips||'<span class="mini">Aucun salon ignoré.</span>'}</div>${adder}`;
}

function xBuildCmds(){
  const item=([c,d,admin])=>`
    <div class="cmd" data-copy="${xesc(c)}" data-q="${xesc((c+' '+d).toLowerCase())}">
      <div><b>${xesc(c)}</b><span>${xesc(d)}</span></div>
      ${admin?'<span class="pill-i">Staff</span>':''}
    </div>`;
  document.querySelectorAll('[data-cmds]').forEach(box=>{
    box.innerHTML=(XCMDS[box.dataset.cmds]||[]).map(item).join('');
  });
  const all=document.getElementById('xAllCmds');
  if(all&&!all.dataset.built){
    const titles={economy:'Économie',automod:'AutoMod',suggestions:'Suggestions',
                  polls:'Sondages',guard:'Protection',apply:'Candidatures'};
    all.innerHTML=Object.entries(XCMDS).map(([k,list])=>
      `<div class="card" data-grp="${k}"><div class="card-h"><h3>${titles[k]}</h3><p>${list.length} commande(s)</p></div>
       <div class="card-b"><div class="cmds">${list.map(item).join('')}</div></div></div>`).join('');
    all.dataset.built='1';
  }
}

function xBuildBadges(){
  const x=cfg.extras||XDEF;
  const b=(id,on,txtOn,txtOff)=>{const el=document.getElementById('xb-'+id);if(!el)return;
    el.textContent=on?(txtOn||'Actif'):(txtOff||'Inactif');
    el.style.cssText=on?'':'background:var(--card2);color:var(--dim)';};
  b('eco',x.economy.enabled); b('am',x.automod.enabled); b('sg',x.suggestions.enabled);
  b('pl',x.polls.enabled); b('gd',x.guard.raidmode||x.guard.agegate,'Protégé','Repos'); b('ap',x.apply.enabled);
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&v!=null)el.textContent=v;};
  set('xs-articles',(x.economy.shop||[]).length);
  set('xs-postes',(x.apply.postes||[]).length);
  set('xs-sugg',x.suggestions.counter||0);
  set('xs-locked',(x.guard.locked_channels||[]).length);
}

function xBuildAll(){
  xBuildShop(); xBuildPostes(); xBuildBadwords(); xBuildAmChannels(); xBuildCmds(); xBuildBadges();
}

document.addEventListener('click',e=>{
  const cp=e.target.closest('.cmd[data-copy]');
  if(cp){
    const v=cp.dataset.copy;
    (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject())
      .then(()=>{cp.classList.add('copied');setTimeout(()=>cp.classList.remove('copied'),900);
                 if(typeof toast==='function') toast('Copié : '+v);})
      .catch(()=>{ if(typeof toast==='function') toast('Copie impossible','err'); });
    return;
  }
  if(e.target.closest('#xShopAdd')){
    const l=cfg.extras.economy.shop=cfg.extras.economy.shop||[];
    if(l.length>=25) return toast('25 articles maximum','err');
    l.push({nom:'Nouvel article',prix:500,description:'',role:null,stock:-1});
    render(); touch(); toast('Article ajouté — pense à enregistrer'); return;
  }
  const rm=e.target.closest('[data-xshoprm]');
  if(rm){
    const i=Number(rm.dataset.xshoprm);
    if(!confirm(`Supprimer l'article « ${cfg.extras.economy.shop[i]?.nom||''} » ?`)) return;
    cfg.extras.economy.shop.splice(i,1); render(); touch(); return;
  }
  if(e.target.closest('#xPosteAdd')){
    const l=cfg.extras.apply.postes=cfg.extras.apply.postes||[];
    if(l.length>=25) return toast('25 postes maximum','err');
    l.push({nom:'Modérateur',emoji:'',description:'Rejoins l\'équipe de modération',
            questions:['Ton âge ?','Ton expérience en modération ?','Tes disponibilités ?']});
    render(); touch(); toast('Poste ajouté — pense à enregistrer'); return;
  }
  const rmp=e.target.closest('[data-xposterm]');
  if(rmp){
    const i=Number(rmp.dataset.xposterm);
    if(!confirm(`Supprimer le poste « ${cfg.extras.apply.postes[i]?.nom||''} » ?`)) return;
    cfg.extras.apply.postes.splice(i,1); render(); touch(); return;
  }
  if(e.target.closest('#xBwAdd')){
    const inp=document.getElementById('xBwIn'); const v=(inp.value||'').trim(); if(!v) return;
    const l=cfg.extras.automod.badwords=cfg.extras.automod.badwords||[];
    v.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean).forEach(w=>{ if(!l.includes(w)) l.push(w); });
    inp.value=''; xBuildBadwords(); touch(); return;
  }
  const bwr=e.target.closest('[data-xbwrm]');
  if(bwr){ cfg.extras.automod.badwords.splice(Number(bwr.dataset.xbwrm),1); xBuildBadwords(); touch(); return; }
  const chr=e.target.closest('[data-xchrm]');
  if(chr){ cfg.extras.automod.ignored_channels.splice(Number(chr.dataset.xchrm),1); xBuildAmChannels(); touch(); return; }
  if(e.target.closest('#xChBtn')){
    const inp=document.getElementById('xChIn'); const v=(inp.value||'').trim(); if(!v) return;
    const l=cfg.extras.automod.ignored_channels=cfg.extras.automod.ignored_channels||[];
    if(!l.map(String).includes(v)) l.push(v);
    inp.value=''; xBuildAmChannels(); touch();
  }
});

document.addEventListener('change',e=>{
  if(e.target.id==='xChAdd'&&e.target.value){
    const l=cfg.extras.automod.ignored_channels=cfg.extras.automod.ignored_channels||[];
    if(!l.map(String).includes(e.target.value)) l.push(e.target.value);
    xBuildAmChannels(); touch();
  }
});

document.addEventListener('input',e=>{
  if(e.target.matches('[data-xq]')){
    const i=Number(e.target.dataset.xq);
    const qs=e.target.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,5).map(s=>s.slice(0,45));
    if(cfg.extras.apply.postes[i]) cfg.extras.apply.postes[i].questions=qs;
    touch(); return;
  }
  if(e.target.id==='xSearch'){
    const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('#xAllCmds .cmd').forEach(c=>{
      c.style.display=(!q||(c.dataset.q||'').includes(q))?'':'none';
    });
    document.querySelectorAll('#xAllCmds .card').forEach(card=>{
      const vis=[...card.querySelectorAll('.cmd')].some(c=>c.style.display!=='none');
      card.style.display=vis?'':'none';
    });
  }
});

function xhookRender(){
  if(typeof render!=='function'||render.__x) return;
  const base=render;
  const wrapped=function(){ try{ xBuildAll(); }catch(e){} base(); try{ xBuildBadges(); }catch(e){} };
  wrapped.__x=true;
  try{ render=wrapped; }catch(e){ window.render=wrapped; }
}

function xhookSave(){
  if(typeof apiSave!=='function'||apiSave.__x) return;
  const base=apiSave;
  const wrapped=async function(data){
    const okBase=await base(data);
    let okX=true;
    try{
      const r=await fetch(apiURL(`/api/guild/${encodeURIComponent(guildId)}/extras`),{
        method:'POST',credentials:API_CREDS,
        headers:{'Content-Type':'application/json',Accept:'application/json',...authHeaders()},
        body:JSON.stringify(data.extras||{})});
      okX=r.ok;
    }catch{ okX=false; }
    return okBase&&okX;
  };
  wrapped.__x=true;
  try{ apiSave=wrapped; }catch(e){ window.apiSave=wrapped; }
}

async function xloadCfg(){
  try{
    const r=await fetch(apiURL(`/api/guild/${encodeURIComponent(guildId)}/extras`),
      {credentials:API_CREDS,cache:'no-store',headers:{Accept:'application/json',...authHeaders()}});
    if(!r.ok) return false;
    const j=await r.json();
    if(!j||!j.config) return false;
    const stats=j.config._stats||{};
    const clean=xclone(j.config); delete clean._stats;
    cfg.extras=deepMerge(xclone(XDEF),clean);
    saved.extras=xclone(cfg.extras);
    const nb=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    const set=(id,v)=>{const el=document.getElementById(id);if(el&&v!=null)el.textContent=nb(v);};
    set('xs-comptes',stats.comptes); set('xs-argent',stats.argent_total);
    return true;
  }catch{ return false; }
}

function xstart(){
  xinject(); xhookRender(); xhookSave();
  let tries=0;
  const t=setInterval(async()=>{
    const app=document.getElementById('app');
    if(app&&!app.classList.contains('hidden')){
      clearInterval(t);
      xextend();
      await xloadCfg();
      try{ render(); touch(); }catch(e){ xBuildAll(); }
      const h=(location.hash||'').replace('#','');
      if(h&&PAGES_HTML[h]&&typeof go==='function') go(h);
    }else if(++tries>400){ clearInterval(t); }
  },150);
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',xstart);
else xstart();
})();
</script>
