const xesc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const xclone=o=>JSON.parse(JSON.stringify(o));

function xinject(){
  const app=document.getElementById('app'); if(!app) return;
  const bar=document.getElementById('savebar');
  for(const [key,html] of Object.entries(PAGES_HTML)){
    if(document.getElementById('pg-'+key)) continue;
    const d=document.createElement('div');
    d.className='page'; d.id='pg-'+key; d.innerHTML=html;
    if(bar) app.insertBefore(d,bar); else app.appendChild(d);
  }
}

function xextend(){
  try{
    XNAV.forEach(g=>{ if(!NAV.some(x=>x[0]===g[0])) NAV.push(g); });
    XNAV.forEach(g=>g[1].forEach(([k,t,s])=>{PAGES[k]=[t,s];}));
    DEFAULTS.extras=xclone(XDEF);
    if(!cfg.extras) cfg.extras=xclone(XDEF);
    if(!saved.extras) saved.extras=xclone(XDEF);
    const add=[
      ['xeconomy','Économie',c=>!!(c.extras&&c.extras.economy.enabled)],
      ['xautomod','AutoMod',c=>!!(c.extras&&c.extras.automod.enabled)],
      ['xsuggestions','Suggestions',c=>!!(c.extras&&c.extras.suggestions.enabled)],
      ['xpolls','Sondages',c=>!!(c.extras&&c.extras.polls.enabled)],
      ['xguard','Protection',c=>!!(c.extras&&(c.extras.guard.raidmode||c.extras.guard.agegate))],
      ['xapply','Candidatures',c=>!!(c.extras&&c.extras.apply.enabled)],
      ['xantinuke','Anti-nuke',c=>!!(c.extras&&c.extras.antinuke.enabled)],
      ['xinfractions','Infractions',c=>!!(c.extras&&c.extras.infractions.enabled)],
      ['xautomsg','Messages automatiques',c=>!!(c.extras&&c.extras.automsg.enabled)],
      ['xbirthdays','Anniversaires',c=>!!(c.extras&&c.extras.birthdays.enabled)],
      ['xcustomcmds','Commandes personnalisées',c=>!!(c.extras&&c.extras.customcmds.enabled)],
    ];
    add.forEach(m=>{ if(!MODULES.some(x=>x[0]===m[0])) MODULES.push(m); });
    if(typeof buildNav==='function') buildNav();
  }catch(e){}
}

document.addEventListener('click',e=>{
  const cp=e.target.closest('.cmd[data-copy]');
  if(cp){
    const v=cp.dataset.copy;
    (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject())
      .then(()=>{cp.classList.add('copied');setTimeout(()=>cp.classList.remove('copied'),900);
                 if(typeof toast==='function') toast('Copié : '+v);})
      .catch(()=>{ if(typeof toast==='function') toast('Copie impossible','err'); });
    return;
  }
  if(e.target.closest('#xShopAdd')){
    const l=cfg.extras.economy.shop=cfg.extras.economy.shop||[];
    if(l.length>=25) return toast('25 articles maximum','err');
    l.push({nom:'Nouvel article',prix:500,description:'',role:null,stock:-1});
    render(); touch(); toast('Article ajouté — pense à enregistrer'); return;
  }
  const rm=e.target.closest('[data-xshoprm]');
  if(rm){
    const i=Number(rm.dataset.xshoprm);
    if(!confirm(`Supprimer l'article « ${cfg.extras.economy.shop[i]?.nom||''} » ?`)) return;
    cfg.extras.economy.shop.splice(i,1); render(); touch(); return;
  }
  if(e.target.closest('#xPosteAdd')){
    const l=cfg.extras.apply.postes=cfg.extras.apply.postes||[];
    if(l.length>=25) return toast('25 postes maximum','err');
    l.push({nom:'Modérateur',emoji:'',description:'Rejoins l\'équipe de modération',
            questions:['Ton âge ?','Ton expérience en modération ?','Tes disponibilités ?']});
    render(); touch(); toast('Poste ajouté — pense à enregistrer'); return;
  }
  const rmp=e.target.closest('[data-xposterm]');
  if(rmp){
    const i=Number(rmp.dataset.xposterm);
    if(!confirm(`Supprimer le poste « ${cfg.extras.apply.postes[i]?.nom||''} » ?`)) return;
    cfg.extras.apply.postes.splice(i,1); render(); touch(); return;
  }
  if(e.target.closest('#xBwAdd')){
    const inp=document.getElementById('xBwIn'); const v=(inp.value||'').trim(); if(!v) return;
    const l=cfg.extras.automod.badwords=cfg.extras.automod.badwords||[];
    v.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean).forEach(w=>{ if(!l.includes(w)) l.push(w); });
    inp.value=''; xBuildBadwords(); touch(); return;
  }

  if(e.target.closest('#xAmAdd')){
    const l=cfg.extras.automsg.messages=cfg.extras.automsg.messages||[];
    if(l.length>=15) return toast('15 messages maximum','err');
    l.push({channel:null,interval_minutes:60,content:'',titre:'',couleur:'#5865F2',enabled:true,last:0});
    render(); touch(); toast('Message ajouté — pense à enregistrer'); return;
  }
  const amrm=e.target.closest('[data-xamrm]');
  if(amrm){
    const i=Number(amrm.dataset.xamrm);
    if(!confirm('Supprimer ce message automatique ?')) return;
    cfg.extras.automsg.messages.splice(i,1); render(); touch(); return;
  }
  if(e.target.closest('#xCcAdd')){
    const l=cfg.extras.customcmds.commands=cfg.extras.customcmds.commands||[];
    if(l.length>=50) return toast('50 commandes maximum','err');
    l.push({nom:'regles',reponse:'',titre:'',couleur:'#5865F2',roles:[]});
    render(); touch(); toast('Commande ajoutée — pense à enregistrer'); return;
  }
  const ccrm=e.target.closest('[data-xccrm]');
  if(ccrm){
    const i=Number(ccrm.dataset.xccrm);
    if(!confirm(`Supprimer la commande « +${cfg.extras.customcmds.commands[i]?.nom||''} » ?`)) return;
    cfg.extras.customcmds.commands.splice(i,1); render(); touch(); return;
  }
  if(e.target.closest('#xAnAddBtn')){
    const inp=document.getElementById('xAnIn'); const v=(inp.value||'').trim();
    if(!/^\d{5,25}$/.test(v)) return toast('Entre un identifiant valide','err');
    const l=cfg.extras.antinuke.whitelist_users=cfg.extras.antinuke.whitelist_users||[];
    if(!l.map(String).includes(v)) l.push(v);
    inp.value=''; xBuildAnUsers(); touch(); return;
  }
  const anrm=e.target.closest('[data-xanrm]');
  if(anrm){ cfg.extras.antinuke.whitelist_users.splice(Number(anrm.dataset.xanrm),1); xBuildAnUsers(); touch(); return; }
  const bwr=e.target.closest('[data-xbwrm]');
  if(bwr){ cfg.extras.automod.badwords.splice(Number(bwr.dataset.xbwrm),1); xBuildBadwords(); touch(); return; }
  const chr=e.target.closest('[data-xchrm]');
  if(chr){ cfg.extras.automod.ignored_channels.splice(Number(chr.dataset.xchrm),1); xBuildAmChannels(); touch(); return; }
  if(e.target.closest('#xChBtn')){
    const inp=document.getElementById('xChIn'); const v=(inp.value||'').trim(); if(!v) return;
    const l=cfg.extras.automod.ignored_channels=cfg.extras.automod.ignored_channels||[];
    if(!l.map(String).includes(v)) l.push(v);
    inp.value=''; xBuildAmChannels(); touch();
  }
});

document.addEventListener('change',e=>{
  if(e.target.id==='xChAdd'&&e.target.value){
    const l=cfg.extras.automod.ignored_channels=cfg.extras.automod.ignored_channels||[];
    if(!l.map(String).includes(e.target.value)) l.push(e.target.value);
    xBuildAmChannels(); touch();
  }
});

document.addEventListener('input',e=>{
  if(e.target.matches('[data-xq]')){
    const i=Number(e.target.dataset.xq);
    const qs=e.target.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,5).map(s=>s.slice(0,45));
    if(cfg.extras.apply.postes[i]) cfg.extras.apply.postes[i].questions=qs;
    touch(); return;
  }
  if(e.target.id==='xSearch'){
    const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('#xAllCmds .cmd').forEach(c=>{
      c.style.display=(!q||(c.dataset.q||'').includes(q))?'':'none';
    });
    document.querySelectorAll('#xAllCmds .card').forEach(card=>{
      const vis=[...card.querySelectorAll('.cmd')].some(c=>c.style.display!=='none');
      card.style.display=vis?'':'none';
    });
  }
});

function xhookRender(){
  if(typeof render!=='function'||render.__x) return;
  const base=render;
  const wrapped=function(){ try{ xBuildAll(); }catch(e){} base(); try{ xBuildBadges(); }catch(e){} };
  wrapped.__x=true;
  try{ render=wrapped; }catch(e){ window.render=wrapped; }
}

function xhookSave(){
  if(typeof apiSave!=='function'||apiSave.__x) return;
  const base=apiSave;
  const wrapped=async function(data){
    const okBase=await base(data);
    let okX=true;
    try{
      const r=await fetch(apiURL(`/api/guild/${encodeURIComponent(guildId)}/extras`),{
        method:'POST',credentials:API_CREDS,
        headers:{'Content-Type':'application/json',Accept:'application/json',...authHeaders()},
        body:JSON.stringify(data.extras||{})});
      okX=r.ok;
    }catch{ okX=false; }
    return okBase&&okX;
  };
  wrapped.__x=true;
  try{ apiSave=wrapped; }catch(e){ window.apiSave=wrapped; }
}

async function xloadCfg(){
  try{
    const r=await fetch(apiURL(`/api/guild/${encodeURIComponent(guildId)}/extras`),
      {credentials:API_CREDS,cache:'no-store',headers:{Accept:'application/json',...authHeaders()}});
    if(!r.ok) return false;
    const j=await r.json();
    if(!j||!j.config) return false;
    const stats=j.config._stats||{};
    const clean=xclone(j.config); delete clean._stats;
    cfg.extras=deepMerge(xclone(XDEF),clean);
    saved.extras=xclone(cfg.extras);
    const nb=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    const set=(id,v)=>{const el=document.getElementById(id);if(el&&v!=null)el.textContent=nb(v);};
    set('xs-comptes',null);
    set('xs-comptes',stats.comptes); set('xs-argent',stats.argent_total);
    return true;
  }catch{ return false; }
}

function xstart(){
  xinject(); xhookRender(); xhookSave(); xextend();
  let tries=0;
  const t=setInterval(async()=>{
    const app=document.getElementById('app');
    if(app&&!app.classList.contains('hidden')){
      clearInterval(t);
      xextend();
      await xloadCfg();
      try{ render(); touch(); }catch(e){ xBuildAll(); }
      const h=(location.hash||'').replace('#','');
      if(h&&PAGES_HTML[h]&&typeof go==='function') go(h);
    }else if(++tries>400){ clearInterval(t); }
  },150);
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',xstart);
else xstart();
})();
</script>
