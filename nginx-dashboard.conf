# =====================================================================
#  dashboard.moderabot.xyz — nginx (VPS 195.95.144.228)
#
#  nginx sert les pages ET transmet les /api/ au bot.
#  Le navigateur ne parle qu'a https://dashboard.moderabot.xyz :
#    - meme origine  -> aucun CORS a configurer
#    - tout en https -> aucun blocage "mixed content"
#    - le port 30121 n'a besoin d'etre ouvert QUE pour ce serveur,
#      jamais pour les navigateurs des visiteurs
#
#  A placer dans /etc/nginx/sites-available/dashboard.moderabot.xyz
#  puis : ln -s ../sites-available/dashboard.moderabot.xyz /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.moderabot.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.moderabot.xyz;

    # Certificats Let's Encrypt (certbot --nginx -d dashboard.moderabot.xyz)
    ssl_certificate     /etc/letsencrypt/live/dashboard.moderabot.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.moderabot.xyz/privkey.pem;

    # ---- les pages du dashboard ----
    root /var/www/dashboard;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- l'API du bot ----
    # Tout ce qui commence par /api/ part vers le bot sur le noeud Pterodactyl.
    # C'est nginx qui fait cet appel, pas le navigateur : le port 30121 doit
    # donc etre ouvert pour l'IP de CE serveur uniquement.
    location /api/ {
        proxy_pass http://node.celian.fr:30121;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le bot peut mettre quelques secondes a repondre au premier appel
        # (il interroge Discord pour valider le token).
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Une reponse de config ne doit jamais etre mise en cache.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Meme chose pour les routes /bot/ du bot, si ton site s'en sert.
    location /bot/ {
        proxy_pass http://node.celian.fr:30121;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Quelques en-tetes de securite de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
